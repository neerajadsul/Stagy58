[package]
name = "rp2040-rust-usbd-kbd"
version = "0.1.0"
edition = "2024"

[dependencies]
rp2040-hal = { version = "0.12.0", features = ["rt", "critical-section-impl"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
cortex-m-rtic = "1.1.4"
defmt = "1.0.1"
defmt-rtt = "1.1.0"
embedded-hal = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
critical-section = "1.2.0"
fugit = "0.3.9"
rp2040-boot2 = "0.3.0"
usbd-human-interface-device = { version = "0.6.0", features = ["defmt"] }
usb-device = "0.3.2"
